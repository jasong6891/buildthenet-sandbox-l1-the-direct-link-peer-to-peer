<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="426" height="187" viewBox="0 0 426 187" role="img" aria-label="Topology: Sandbox lesson 1: The Direct Link (Peer-to-Peer)">
<title>Topology: Sandbox lesson 1: The Direct Link (Peer-to-Peer)</title>
<style>
svg{color-scheme:light dark}
.bg{fill:Canvas}
