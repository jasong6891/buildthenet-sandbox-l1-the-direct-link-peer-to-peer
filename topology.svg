<text class="t port" text-anchor="middle" x="230.2" y="118.4">Eth0</text>
<rect class="dev" fill="none" stroke="currentColor" rx="8" x="48.0" y="93.0" width="132" height="46"/>
<text class="t lbl" text-anchor="middle" x="114.0" y="114.0">PC-1</text>
<text class="t sub" text-anchor="middle" x="114.0" y="129.0">PC</text>
<rect class="dev" fill="none" stroke="currentColor" rx="8" x="246.0" y="92.0" width="132" height="46"/>
<text class="t lbl" text-anchor="middle" x="312.0" y="113.0">PC-2</text>
<text class="t sub" text-anchor="middle" x="312.0" y="128.0">PC</text>
